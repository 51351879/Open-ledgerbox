# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Everything here is runnable locally. That is the point: a check that only
# exists on a server is a check nobody meets until a push fails, and the one
# defect class this project keeps producing -- a real value copied out of a
# debugging session into a committed file, six times so far -- is caught by
# `pytest`, which nothing obliges anyone to run before pushing. CI is what
# obliges them.
#
# `LEDGERBOX_REAL_FIXTURES` is deliberately unset on every job. The real
# statements live outside the repository and CI must never need them; the tests
# that use them skip rather than fail. That is a real coverage gap and it is the
# correct trade -- see docs/STATUS.md §7.

name: CI

on:
  push:
    branches: ["**"]
    # Tags too, because publishing lives at the bottom of this file and it
    # `needs:` every job above it. Nothing reaches PyPI that did not pass the
    # same gates a branch push does -- a separate release workflow would have
    # been a second, weaker definition of "green".
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  # The PR number when there is one, so a push to a branch that already has a
  # PR open does not run the nine-cell matrix twice under two different refs
  # (`refs/heads/x` and `refs/pull/N/merge`).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell must not hide the others.
      fail-fast: false
      matrix:
        # Windows only, matching the README's scope table: "supported" means
        # validated, and the one validated platform is Windows. The first
        # hosted run proved the point unprompted -- mypy fails on every other
        # OS because the data-directory guard reads a Windows-only stat
        # attribute. Other platforms return here inside the community PRs
        # that validate them, not before.
        os: [windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests tools

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest -rs

  beancount:
    # The plain-text escape hatch is only an escape hatch if something other
    # than ledgerbox will read it. Every other job skips these tests, which is
    # why docs/STATUS.md §7 had to say "CI green does not mean beancount
    # accepted the export". This job is that sentence being retired.
    name: bean-check oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ledgerbox and beancount
        # beancount is GPL-2.0-only and is never imported: it is installed as a
        # separate program and invoked as a subprocess, which is the same
        # arms-length arrangement docs/EXECUTION_PLAN.md §1.2 chose so this
        # project can keep a permissive licence open to it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install beancount
          echo "LEDGERBOX_BEAN_CHECK=$(command -v bean-check)" >> "$GITHUB_ENV"

      - name: pytest (beancount export)
        run: pytest tests/test_beancount_export.py -rs --junitxml=beancount.xml

      - name: Fail if the oracle did not actually run
        # Without this the job passes by skipping, which is the precise failure
        # mode it exists to remove. A skipped assertion is not a passed one.
        #
        # But the question is "did anything skip *for want of bean-check*", not
        # "did anything skip". Six tests in this file are gated on
        # LEDGERBOX_REAL_FIXTURES, which no job here sets and none ever should;
        # asserting `skipped == 0` made this job red on every run and blamed it
        # on a missing bean-check that was present the whole time. Asking the
        # broader question produced a confident, wrong answer -- which is the
        # thing this repository is about.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          root = ET.parse("beancount.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          skipped = [
              (case.get("classname", ""), case.get("name", ""), skip.get("message", ""))
              for case in suite.iter("testcase")
              for skip in case.findall("skipped")
          ]
          oracle = [s for s in skipped if "bean" in s[2].lower()]

          print(f"{suite.get('tests')} test(s), {len(skipped)} skipped, {len(oracle)} for the oracle")
          for classname, name, message in skipped:
              print(f"  skipped: {name} -- {message}")
          if oracle:
              sys.exit(
                  f"{len(oracle)} test(s) skipped because bean-check was unavailable. "
                  f"This job exists to run them; a green result here would mean nothing."
              )
          PY

  web:
    # The frontend's behavioural tests are the same shape as the beancount
    # oracle: they need a program that is not a Python dependency, and
    # `tests/test_web_behaviour.py` skips rather than fails when it is absent.
    # A skip is right on a contributor's machine and wrong here, so this job is
    # where the absence becomes an error.
    #
    # It exists because that file *said* so before it was true. The docstring
    # named "the CI job" while no job here mentioned node, and the runners
    # happen to ship one -- so the tests really were running, and the sentence
    # was still describing something that did not exist. The failure it would
    # eventually have caused is the one §5.31 is about: a green CI over twenty
    # tests nobody ran, the day an image drops node.
    name: frontend behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to a version, not to `latest`: the point of this job is that
          # the interpreter is present and known, and "whatever was newest that
          # morning" is neither.
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: node --test, directly
        # Run once on its own so a failure here reads as "the JavaScript is
        # wrong" rather than as a pytest failure two layers down.
        run: node --test "tests/js/*.test.js"

      - name: pytest (the bridge)
        run: pytest tests/test_web_behaviour.py -rs --junitxml=web.xml

      - name: Fail if the suite did not actually run
        # Same question the beancount job asks, and for the same reason: this
        # job passes by skipping otherwise, which is the failure mode it exists
        # to remove.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          root = ET.parse("web.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          skipped = [
              (case.get("name", ""), skip.get("message", ""))
              for case in suite.iter("testcase")
              for skip in case.findall("skipped")
          ]
          print(f"{suite.get('tests')} test(s), {len(skipped)} skipped")
          for name, message in skipped:
              print(f"  skipped: {name} -- {message}")
          if skipped:
              sys.exit(
                  f"{len(skipped)} test(s) skipped. Every skip in this file means node was "
                  f"not found; this job exists to run them, so a green result would mean "
                  f"nothing."
              )
          PY

  package:
    # docs/RELEASE_PLAN.md §4a. Every other job here runs the source tree; this
    # one runs what a user would actually receive. The two are not the same
    # question, and the gap between them is where a packaging mistake lives:
    # the official Skill reaches the wheel through `force-include` entries in
    # pyproject, which no test of the checkout can exercise, because in a
    # checkout the Skill is simply there.
    #
    # Windows, matching the scope declaration. The console scripts are `.exe`
    # shims here and shell scripts elsewhere, so "the bridge is installed" is a
    # platform-specific question and this is the platform that is supported.
    name: the wheel installs and answers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        # `python -m build` with no flags builds the sdist first and then the
        # wheel *from that sdist*, which is the arrangement that catches a file
        # the wheel would have picked up out of the working tree and a real
        # download would not have contained.
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install into an environment with nothing else in it
        # Outside the checkout on purpose. An environment created inside the
        # tree invites the tree onto `sys.path`, and the whole point of the
        # next step is that it cannot reach the tree.
        run: |
          python -m venv "${{ runner.temp }}\fresh"
          $wheels = @(Get-ChildItem dist\*.whl)
          if ($wheels.Count -ne 1) { throw "expected one wheel, built $($wheels.Count)" }
          & "${{ runner.temp }}\fresh\Scripts\python.exe" -m pip install "$($wheels[0].FullName)[mcp]"

      - name: The artifact answers for itself
        # The assertions are in tools/package_smoke.py, type-checked by mypy and
        # refuted one at a time by tests/test_package_smoke.py. Retyping them
        # into this file would put the gate somewhere nothing can test it.
        run: '& "${{ runner.temp }}\fresh\Scripts\python.exe" tools/package_smoke.py'

      - name: Keep the artifact that passed
        # So `publish` uploads *this* wheel rather than a second build of the
        # same commit. Two builds of one tree are not guaranteed to be the same
        # bytes, and "the one we tested" has to mean the one we tested.
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  no-data-files:
    name: no statements in the index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_repo_data.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Both scanners want the history, not just the checkout. A value
          # removed in the tip commit is still in the objects, and "we deleted
          # it" is not a remediation once it has been pushed.
          fetch-depth: 0

      - name: gitleaks (whole history)
        # The pinned binary over the full history, not the wrapper action: the
        # action derives a commit range from the push event, and on the very
        # first push of a branch that range has no base, so it fails on its own
        # plumbing rather than on any finding. Scanning everything every time
        # is also the honest scope -- "we deleted it" is not a remediation.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .

      - name: TruffleHog
        # Pinned, not `@main`. A project whose README warns about `npx -y` on a
        # brokerage password does not get to run a moving target over its own
        # history.
        uses: trufflesecurity/trufflehog@v3.90.10
        with:
          extra_args: --results=verified,unknown

  release-tag:
    # A tag is a promise about which commit a version came from. This is the
    # gate that keeps the promise checkable, and it runs before the artifact is
    # anywhere near an index: PyPI accepts a filename once and refuses it
    # forever after, so "we will fix the tag" is not available as a remedy.
    #
    # The comparison itself is in tools/check_release_tag.py, with its
    # counterexamples in tests/test_release_tag.py -- including the one that
    # matters here, `v0.1.0` against a packaged `0.1.0a1`, which any prefix
    # comparison would have waved through.
    name: the tag and the version are one number
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_release_tag.py

  publish:
    # Everything above, and only then. There is no path to PyPI that skips a
    # test, a secret scan or the wheel smoke, because the alternative -- a
    # release workflow with its own idea of green -- is a second definition of
    # the same word, and this project has spent enough on those.
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, beancount, web, package, no-data-files, secrets, release-tag]
    runs-on: ubuntu-latest

    # Trusted Publishing: PyPI verifies this workflow's OIDC identity and
    # issues a short-lived token for that upload alone. No API token exists to
    # be stored, leaked, or rotated -- which is the same argument the rest of
    # this repository makes about the ledger never holding a model key.
    environment:
      name: pypi
      url: https://pypi.org/p/ledgerbox
    permissions:
      id-token: write

    steps:
      - name: Take the artifact the smoke test installed
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload
        # Pinned to a release, not to `release/v1`, which is a branch that
        # moves. The step that can publish under this project's name is the
        # last place to run whatever was newest that morning.
        uses: pypa/gh-action-pypi-publish@v1.14.2
